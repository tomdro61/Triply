# The merge gate for `main` (docs: CLAUDE.md "Git & dev workflow").
#
# The job NAMES below marked LOAD-BEARING are named in main's branch
# protection. Renaming or deleting one without updating protection first blocks
# every PR. To remove CI: take the required checks off the branch, THEN change
# this file.
name: CI

on:
  pull_request: # every PR, any base (a stacked PR retargeted to main keeps its run)
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A PR's newer push cancels its older run. On main every commit gets its own
  # group (its SHA): a shared group would let GitHub drop a PENDING main run
  # when a third merge arrives, and that commit would never get a result.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: app (typecheck, test, build) # LOAD-BEARING
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The Claude Code hooks' own unit tests (docs: CLAUDE.md "Hooks"). Files
      # are named, not globbed, so a moved or deleted test fails loudly.
      - run: node --test .githooks/lib.test.mjs .githooks/pre-commit.test.mjs .claude/hooks/guard-lib.test.mjs
      - run: npm ci
      # Separate from the build on purpose: `next build` drops type errors in
      # test files, which is how 8 of them sat on main unnoticed.
      - run: npm run typecheck
      # No job-level env: the tests run with exactly what vitest.setup.ts gives
      # them locally (a job-level NEXT_PUBLIC_APP_ENV would change fail-closed
      # behaviour in every test that doesn't set it).
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Needed at build time (the build throws without them). Dummies only;
          # this workflow has no secrets and must never need one.
          RESEND_API_KEY: re_ci_dummy
          STRIPE_SECRET_KEY: sk_test_ci_dummy
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_dummy
          # Every outside service points at a dead host, so a future build-time
          # call fails loudly instead of reaching production ResLab / Park
          # Guard / the CMS (their clients fall back to production hosts when
          # the URL is unset).
          RESLAB_API_URL: https://reslab.invalid/v1
          RESLAB_API_DOMAIN: ci.invalid
          PARKGUARD_API_URL: https://parkguard.invalid
          NEXT_PUBLIC_CMS_URL: http://cms.invalid
          NEXT_PUBLIC_APP_URL: https://www.triplypro.com
          # Build the variant that ships.
          NEXT_PUBLIC_APP_ENV: production
          # Deliberately unset: SENTRY_AUTH_TOKEN (would upload source maps),
          # ENABLE_RESLAB_LOCATION_SNAPSHOT / ENABLE_DIRECT_LOTS (would read
          # Supabase while prerendering).

  blog-engine:
    name: blog-engine (typecheck, test) # LOAD-BEARING
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/blog-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: scripts/blog-engine/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      # node:test files; they make no network calls. src/config.ts refuses to
      # load without these two keys, so they get dummies and a dead CMS host.
      - run: npx tsx --test src/*.test.ts
        env:
          ANTHROPIC_API_KEY: ci_dummy
          PAYLOAD_API_KEY: ci_dummy
          PAYLOAD_CMS_URL: http://cms.invalid

  lint:
    # Fails on any NEW ESLint error. The errors that existed when this became a
    # gate are listed in eslint-suppressions.json; the last step stops that
    # list from growing.
    name: lint # LOAD-BEARING once it is added to branch protection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the merge commit and its parents (HEAD^1 = the base)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # On a PR, HEAD is the merge commit and HEAD^1 is the base it was built on.
      - name: Known-error counts must not rise
        if: github.event_name == 'pull_request'
        run: node scripts/check-lint-suppressions.mjs HEAD^1

  checkout-smoke:
    # A browser walks checkout on THIS PR's preview and stops before Pay
    # (e2e/checkout-smoke.spec.ts). ADVISORY: not in branch protection yet;
    # the date to review that is in the team's status notes.
    #
    # The one job that can open protected previews. Rules for editing it:
    # - No stored secret. It proves its identity to Vercel with a GitHub OIDC
    #   token (Vercel > Deployment Protection > Trusted Sources, Preview only).
    # - Never upload a Playwright trace, HAR or HTML report: this repo is
    #   public and those record the access token. Screenshots and text only.
    # - It installs e2e/ only (its own lockfile, scripts off), never the app's
    #   dependencies.
    # - A run that cannot test is RED (CONFIG), never a silent pass.
    name: checkout-smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      deployments: read # find this commit's Vercel preview
      id-token: write # the OIDC token Vercel trusts
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Same-repository PRs only
        if: github.event.pull_request.head.repo.full_name != github.repository
        working-directory: .
        run: |
          echo "::error title=checkout-smoke CONFIG::[CONFIG] cannot run on a fork's PR: forks get no credential for protected previews"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Find this commit's preview
        id: preview
        run: node find-preview.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The PR's own head commit: on pull_request, github.sha is the merge
          # commit, which Vercel never built.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Walk checkout, stop before Pay
        run: npx playwright test
        env:
          SMOKE_BASE_URL: ${{ steps.preview.outputs.url }}
      # Fails the job on a guard violation even if a retry passed.
      - name: Summary
        if: always()
        run: node summarize.mjs
      - name: Screenshots of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkout-smoke-screenshots
          path: e2e/test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

